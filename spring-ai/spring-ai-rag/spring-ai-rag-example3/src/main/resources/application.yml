server:
  port: 8090
spring:
  application:
    name: springai-rag-example3
  ai:
    deepseek:
      base-url: https://api.deepseek.com
      api-key: ${deepseek.api-key}
    dashscope:
      embedding:
        options:
          model: text-embedding-v4
          dimensions: 768
      api-key: ${dashscope.api-key}
    vectorstore:
      pgvector:
        # 向量索引类型
        index-type: HNSW
        # 距离度量，余弦值
        distance-type: COSINE_DISTANCE
        # 向量维度
        dimensions: 768
        # 批量处理大小
        max-document-batch-size: 9
        # 启动时是否自动创建表
        initialize-schema: true
        # 创建的表名
        table-name: vector_st
  datasource:
    url: jdbc:postgresql://${pgvector_host}:1922/rag_test
    username: onews_dev
    password: ${pgvector_password}
  elasticsearch:
    uris: http://172.30.47.222:9200
  neo4j:
    uri: bolt://localhost:7687
    authentication:
      username: neo4j
      password: neo4j666

minio:
  url: http://localhost:9000
  accessKey: minioadmin
  secretKey: minioadmin
  bucketName: rag-test
  endpoint: http://localhost:9000