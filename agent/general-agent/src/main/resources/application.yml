server:
  port: 8008
  servlet:
    encoding:
      charset: UTF-8
      force: true
      enabled: true
spring:
  main:
    web-application-type: reactive
  ai:
    openai:
      api-key: ${dashscope.api-key}
      base-url: https://dashscope.aliyuncs.com/compatible-mode/
      chat:
        options:
          model: qwen-plus
          temperature: 0.7
          maxTokens: 5000
