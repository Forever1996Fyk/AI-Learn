server:
  port: 8889
  servlet:
    encoding:
      charset: UTF-8
      force: true
      enabled: true

spring:
  autoconfigure:
    exclude:
      - org.springframework.ai.model.zhipuai.autoconfigure.ZhiPuAiChatAutoConfiguration
      - org.springframework.ai.model.zhipuai.autoconfigure.ZhiPuAiEmbeddingAutoConfiguration
  datasource:
    url: jdbc:mysql://127.0.0.1:3306/dodo_agentx?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=GMT%2B8&allowPublicKeyRetrieval=true
    username: <your-mysql-username>
    password: <your-mysql-password>
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 5
  ai:
    deepseek:
      api-key: <your-deepseek-api-key>
      base-url: https://api.deepseek.com
      chat:
        options:
          model: deepseek-v4-flash
          temperature: 0.7
    openai:
      api-key: <your-dashscope-api-key>
      base-url: https://dashscope.aliyuncs.com/compatible-mode/
      chat:
        options:
          model: qwen-plus
          temperature: 0.7
      embedding:
        options:
          model: text-embedding-v4
    zhipuai:
      api-key: empty
  servlet:
    multipart:
      enabled: true
      max-file-size: 100MB
      max-request-size: 300MB
  data:
    redis:
      host: 192.168.113.52   # 记得改成你自己的
      port: 6389
      database: 0
      timeout: 5s
      password: 8uhb*UHB

# Skills 目录（改成你自己的本地绝对路径）
skills:
  directory: <your-skills-directory-path>

# 部署模式：standalone=单实例（默认，不配置也是它，开箱即用）；
# cluster=多实例部署，断点续传事件写 Redis Stream、中断走 Redis 广播、
# Skill 分发走 MinIO（需要 Redis 和 MinIO 可用），多实例时每个实例都配 cluster，
# 配合 nginx 负载均衡使用（完整配置参考项目里的 nginx-conf/nginx.conf）
deploy:
  mode: standalone

# 数据分析相关配置
data-agent:
  bird-eval:
    max-rounds: 50
    temperature: 0.0
  schema:
    provider: mschema        # mschema（默认，实时数据库自省）| yml（静态 YAML 字典）
    mschema:
      # 排除的表（逗号分隔，支持 * 通配符，如 agentx_*）
      exclude-tables: agentx_*
      refresh-cron: "0 0 3 * * *"
  safety:
    max-rows: 200
    max-joins: 3
    query-timeout-seconds: 30
  # EXPLAIN 预检查只拦明显过重的明细扫描和 JOIN 扩张，不因为小表全扫或没索引直接拒绝
  explain-precheck:
    timeout-seconds: 5
    max-estimated-rows: 100000
  data-permission:
    enabled: true          # 数据权限开关：false=所有用户可查所有数据；true=按角色 dataScope 过滤
  sensitive-filter:
    enabled: true          # 敏感字段脱敏开关：false=原样返回；true=命中的列值替换为 ********
    mask-fields: sys_user.password,user_profile.id_card,user_profile.home_address
  chart:
    mcp-url: http://localhost:3033/mcp
    minio:
      endpoint: <your-minio-host>
      port: 19000
      use-ssl: false

# MinIO 完整配置
minio:
  endpoint: http://<your-minio-host>:19000/
  access-key: <your-minio-access-key>
  secret-key: <your-minio-secret-key>
  bucket-name: dodo-agentx-files

# PgVector 连接（用于文件 RAG + 长期语义记忆）
embeddings:
  store:
    host: <your-pgvector-host>
    port: 5433
    database: vector_store
    user: <your-pgvector-user>
    password: <your-pgvector-password>

# 多模态模型
multimodal:
  model: qwen3.6-flash
  temperature: 0.7

# 文件相关
file:
  max-count: 3
  max-size-mb: 100
  large-file-threshold: 10000       # 字符数，超过则切分 + 向量化
  text-max-length: 20000            # extracted_text 截断长度

# Tavily 联网搜索（不联网可保持占位，前端关闭联网开关即可）
tavily:
  api-key: <your-tavily-api-key>
  mcp-url: https://mcp.tavily.com/mcp/

logging:
  level:
    cn.hollis.llm.mentor.agentx: INFO
    com.agentx.ai: INFO
    org.springframework.ai: INFO
    io.modelcontextprotocol.client: ERROR
