server:
  port: 8888
  servlet:
    encoding:
      charset: UTF-8
      force: true
      enabled: true
spring:
  ai:
    openai:
      api-key: ${dashscope.api-key}
      base-url: https://dashscope.aliyuncs.com/compatible-mode/
      chat:
        options:
          model: qwen-plus
          temperature: 0.7
      embedding:
        base-url: https://dashscope.aliyuncs.com/compatible-mode/
        api-key: ${dashscope.api-key}
        options:
          model: text-embedding-v4
          dimensions: 1024
  datasource:
    url: jdbc:mysql://${mysql.host}:3306/shushu_agent?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=GMT%2B8 # 记得改成你自己的
    username: ${mysql.username} # 记得改成你自己的
    password: ${mysql.password} # 记得改成你自己的
    driver-class-name: com.mysql.cj.jdbc.Driver
    # 连接池配置
    hikari:
      minimum-idle: 5
      maximum-pool-size: 20
      idle-timeout: 60000
      connection-timeout: 30000
      max-lifetime: 1800000

  # Redis 配置
  data:
    redis:
      host: ${redis.host}   # 记得改成你自己的
      port: 6379
      database: 0
      timeout: 5s
      password: ${redis.password}

  servlet:
    multipart:
      enabled: true
      max-file-size: 50MB
      max-request-size: 50MB
# MyBatis-Plus 配置
mybatis-plus:
  mapper-locations: classpath:mapper/*.xml

minio:
  url: http://127.0.0.1:9000/   # 记得改成你自己的
  accessKey: minioadmin # 记得改成你自己的
  secretKey: minioadmin # 记得改成你自己的
  bucketName: shushu-agent
  endpoint: http://127.0.0.1:9000/

embeddings:
  store:
    host: ${embedding.host}   # 记得改成你自己的
    port: 1922   # 记得改成你自己的
    database: vector_store   # 记得改成你自己的
    user: onews_dev   # 记得改成你自己的
    password: ${embedding.password}   # 记得改成你自己的

# Tavily 搜索引擎配置
tavily:
  api-key: ${tavily.api-key}  # 记得改成你自己的
  mcp-url: https://mcp.tavily.com/mcp/

logging:
  level:
    org:
      springframework:
        ai: INFO
    io:
      modelcontextprotocol:
        client: ERROR